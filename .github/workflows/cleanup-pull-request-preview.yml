name: Clean up pull request preview

# Deletes https://atechaccount.github.io/CSS-Grid-Game/pr-preview/pr-<number>/ once the
# pull request closes, whether it merged or not.
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: gh-pages-branch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  remove-preview:
    name: Remove preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Remove preview from gh-pages
        env:
          PAGES_TARGET_SUBDIRECTORY: pr-preview/pr-${{ github.event.pull_request.number }}
          PAGES_SOURCE_DIRECTORY: ""
          PAGES_COMMIT_MESSAGE: "Remove preview for pull request #${{ github.event.pull_request.number }}"
        run: .github/scripts/publish-gh-pages-directory.sh

      - name: Comment that the preview was removed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_BODY: |
            <!-- skydock-pull-request-preview -->
            **Sky Dock preview:** removed, because this pull request is closed.
        run: .github/scripts/comment-preview-url.sh
